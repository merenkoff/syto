<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#132A4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sieve">
      <circle cx="256" cy="232" r="128"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- mesh -->
  <g clip-path="url(#sieve)" stroke="#E6EDF3" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <g>
      <line x1="128" y1="168" x2="384" y2="168"/>
      <line x1="128" y1="200" x2="384" y2="200"/>
      <line x1="128" y1="232" x2="384" y2="232"/>
      <line x1="128" y1="264" x2="384" y2="264"/>
      <line x1="128" y1="296" x2="384" y2="296"/>
      <line x1="128" y1="328" x2="384" y2="328"/>
    </g>
    <g>
      <line x1="160" y1="104" x2="160" y2="360"/>
      <line x1="192" y1="104" x2="192" y2="360"/>
      <line x1="224" y1="104" x2="224" y2="360"/>
      <line x1="256" y1="104" x2="256" y2="360"/>
      <line x1="288" y1="104" x2="288" y2="360"/>
      <line x1="320" y1="104" x2="320" y2="360"/>
      <line x1="352" y1="104" x2="352" y2="360"/>
    </g>
  </g>

  <!-- rim -->
  <circle cx="256" cy="232" r="128" fill="none" stroke="#E6EDF3" stroke-width="22"/>

  <!-- blocked (spam) — stays on the mesh -->
  <circle cx="256" cy="200" r="36" fill="#FF6B6B"/>
  <g stroke="#0B1220" stroke-width="9" stroke-linecap="round">
    <line x1="242" y1="186" x2="270" y2="214"/>
    <line x1="270" y1="186" x2="242" y2="214"/>
  </g>

  <!-- passed (yours) — fell through -->
  <circle cx="256" cy="424" r="28" fill="#3FB950"/>
  <path d="M243 424 l9 9 l18 -19" fill="none" stroke="#0B1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
