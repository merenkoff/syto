# Builds a debug APK on every push to any branch and publishes it as a workflow artifact.
# This is the delivery path from any session to the phone (docs/DECISIONS.md, D-003).
name: Build debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache, wrapper validation)
        uses: gradle/actions/setup-gradle@v6

      - name: Show Android SDK on the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK after the commit
        id: apk
        run: |
          sha7="${GITHUB_SHA::7}"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/syto-debug-${sha7}.apk"
          echo "sha7=${sha7}" >> "$GITHUB_OUTPUT"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: syto-debug-${{ steps.apk.outputs.sha7 }}
          path: app/build/outputs/apk/debug/syto-debug-*.apk
          if-no-files-found: error
          retention-days: 30
